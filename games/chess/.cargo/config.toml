# Link with LLVM's linker, which ships with Rust, instead of MSVC's link.exe: it links a game
# about a third faster, and linking is most of the time an incremental rebuild takes.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"

# Axiom (x86_64-axiom.json, from Axiom's sdk/rust). getrandom has no Axiom backend of its own, so
# it takes the processor's RDRAND.
[target.x86_64-axiom]
rustflags = ["--cfg", 'getrandom_backend="rdrand"']
