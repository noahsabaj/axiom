[package]
name = "axiom"
version = "0.1.0"
edition = "2024"
description = "Axiom's system interface, for programs in Rust (no_std; std through its zkvm layer)"

[features]
default = ["alloc"]
# Vec- and String-returning calls (Files::read, list, volumes): the program
# needs a #[global_allocator]
alloc = []

[lib]
test = false
doctest = false
